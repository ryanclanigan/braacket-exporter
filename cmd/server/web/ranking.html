<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tourknee Rankings</title>
    <link rel="icon" type="image/svg+xml" href="/assets/tourknee-mark.svg" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body class="public-ranking-page">
    <main class="public-ranking">
      <header class="public-ranking-header">
        <div class="brand-lockup">
          <img class="brand-mark" src="/assets/tourknee-mark.svg" alt="" />
          <div>
            <p class="eyebrow">Tourknee</p>
            <h1>Rankings</h1>
          </div>
        </div>
        <p id="ranking-summary" class="muted">Loading rankings…</p>
      </header>

      <section class="public-ranking-card" aria-live="polite">
        <div id="ranking-error" class="callout warning" hidden></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>Score</th>
                <th>Record</th>
                <th>Events</th>
              </tr>
            </thead>
            <tbody id="ranking-rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const summary = document.querySelector("#ranking-summary");
      const rows = document.querySelector("#ranking-rows");
      const errorBox = document.querySelector("#ranking-error");

      function escapeHTML(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatScore(value) {
        const score = Number(value);
        return Number.isFinite(score) ? score.toFixed(3) : "—";
      }

      function totalRecord(player) {
        if (Number.isFinite(Number(player.wins)) && Number.isFinite(Number(player.losses))) {
          return { wins: Number(player.wins), losses: Number(player.losses) };
        }
        return (Array.isArray(player.records) ? player.records : []).reduce(
          (total, record) => ({
            wins: total.wins + Number(record.wins || 0),
            losses: total.losses + Number(record.losses || 0),
          }),
          { wins: 0, losses: 0 },
        );
      }

      function renderH2H(records) {
        const opponents = Array.isArray(records) ? records : [];
        if (!opponents.length) {
          return `<div class="ranking-h2h-panel"><div class="muted">No head-to-head records are available for this player.</div></div>`;
        }
        return `
          <div class="ranking-h2h-panel">
            <div class="ranking-h2h-heading"><strong>Head To Head</strong><span class="muted">${opponents.length} opponent${opponents.length === 1 ? "" : "s"}</span></div>
            <div class="ranking-h2h-list">
              ${opponents.map((record) => `
                <div class="ranking-h2h-item">
                  <div class="ranking-h2h-rank">${Number(record.opponentRank) > 0 ? `#${escapeHTML(record.opponentRank)}` : "UR"}</div>
                  <div class="ranking-h2h-opponent"><strong>${escapeHTML(record.opponent || "Unknown")}</strong></div>
                  <div class="ranking-h2h-score"><span class="wins">${escapeHTML(record.wins || 0)}</span><span class="muted">-</span><span class="losses">${escapeHTML(record.losses || 0)}</span></div>
                  <div class="ranking-h2h-summary muted">${Number(record.wins || 0) + Number(record.losses || 0)} set${Number(record.wins || 0) + Number(record.losses || 0) === 1 ? "" : "s"}</div>
                </div>
              `).join("")}
            </div>
          </div>`;
      }

      function renderRankings(data, label = "") {
        const players = Array.isArray(data.players) ? data.players : [];
        summary.textContent = `${label}${data.system || "Colley"} rankings • ${data.startDate} to ${data.endDate} • ${data.minTournaments || 3}+ events`;
        rows.innerHTML = players.length
          ? players
              .map(
                (player, index) => {
                  const record = totalRecord(player);
                  const playerKey = String(player.canonicalPlayerId || player.name || index);
                  const events = Number.isFinite(Number(player.tournaments)) ? player.tournaments : "—";
                  return `
                  <tr class="public-ranking-row" data-player-key="${escapeHTML(playerKey)}" tabindex="0" aria-expanded="false">
                    <td>${escapeHTML(player.rank)}</td>
                    <td><strong>${escapeHTML(player.name)}</strong></td>
                    <td>${formatScore(player.score)}</td>
                    <td>${record.wins}–${record.losses}</td>
                    <td>${escapeHTML(events)}</td>
                  </tr>
                  <tr class="ranking-detail-row" data-player-detail="${escapeHTML(playerKey)}" hidden>
                    <td colspan="5">${renderH2H(player.records)}</td>
                  </tr>`;
                }
              )
              .join("")
          : `<tr><td colspan="5" class="muted">No players match the default ranking.</td></tr>`;
      }

      async function loadRankings() {
        const savedRankingsResponse = await fetch("/api/saved-rankings");
        const savedRankings = await savedRankingsResponse.json();
        if (!savedRankingsResponse.ok) {
          throw new Error(savedRankings.error || "Failed to load the default ranking.");
        }
        const defaultRanking = (savedRankings.savedRankings || []).find((ranking) => ranking.isDefault);
        if (defaultRanking?.id) {
          const snapshotResponse = await fetch(`/api/saved-rankings/${defaultRanking.id}`);
          const snapshotData = await snapshotResponse.json();
          if (!snapshotResponse.ok) {
            throw new Error(snapshotData.error || "Failed to load the default ranking.");
          }
          renderRankings(snapshotData.snapshot, `${snapshotData.savedRanking?.name || "Default"} • `);
          return;
        }

        const response = await fetch("/api/rankings?limit=100&includeRecords=false");
        const data = await response.json();
        if (!response.ok || data.status !== "ready") {
          throw new Error(data.error || data.message || "Rankings are unavailable.");
        }
        renderRankings(data);
      }

      loadRankings().catch((error) => {
        summary.textContent = "Rankings unavailable";
        errorBox.hidden = false;
        errorBox.textContent = error instanceof Error ? error.message : String(error);
      });

      rows.addEventListener("click", (event) => {
        const row = event.target.closest(".public-ranking-row");
        if (!row) return;
        const detail = rows.querySelector(`[data-player-detail="${CSS.escape(row.dataset.playerKey)}"]`);
        if (!detail) return;
        const expanded = row.getAttribute("aria-expanded") === "true";
        row.setAttribute("aria-expanded", String(!expanded));
        detail.hidden = expanded;
      });

      rows.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          event.target.closest(".public-ranking-row")?.click();
        }
      });
    </script>
  </body>
</html>
